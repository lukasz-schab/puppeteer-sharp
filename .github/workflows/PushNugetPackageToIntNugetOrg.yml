name: PushToIntNugetOrg

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x' # The .NET SDK version to use

permissions:
  contents: read

jobs:
  PushToIntNugetOrg:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        use-policy-store: true
        api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
    - name: Setup .NET
      uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3.4.2
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: |
        dotnet restore lib/PuppeteerSharp.sln
        dotnet dev-certs https -ep lib/PuppeteerSharp.TestServer/testCert.cer
    - name: Build
      run: |
        dotnet build lib/PuppeteerSharp.sln --configuration Release --no-restore
        ls ./lib/PuppeteerSharp/bin/Release
    - name: NugetPush to int.nuget.org
      env:
        NUGET_TOKEN_TEST_EXISTS: ${{ secrets.NUGET_INT_API_KEY }}
      if: env.NUGET_TOKEN_TEST_EXISTS != ''
      run: |
        dotnet nuget push ./lib/PuppeteerSharp/bin/Release/*.nupkg --api-key ${{secrets.NUGET_INT_API_KEY}} --source https://apiint.nugettest.org/v3/index.json
    - name: Restore (CDP only)
      run: |
        dotnet restore lib/PuppeteerSharp/PuppeteerSharp.csproj /p:DefineConstants=CDP_ONLY
    - name: Build (CDP only)
      run: |
        dotnet build lib/PuppeteerSharp/PuppeteerSharp.csproj /p:DefineConstants=CDP_ONLY --configuration Release --no-restore --no-incremental
    - name: Pack (CDP only)
      run: |
        dotnet pack lib/PuppeteerSharp/PuppeteerSharp.csproj /p:DefineConstants=CDP_ONLY /p:Title=PuppeteerSharp.Cdp /p:PackageId=PuppeteerSharp.Cdp /p:Description="Headless Browser .NET API with CDP support only (no WebDriverBiDi)" --configuration Release --no-restore --no-build
        ls ./lib/PuppeteerSharp/bin/Release
    - name: NugetPush to int.nuget.org (CDP only)
      env:
        NUGET_TOKEN_TEST_EXISTS: ${{ secrets.NUGET_INT_API_KEY }}
      if: env.NUGET_TOKEN_TEST_EXISTS != ''
      run: |
        dotnet nuget push ./lib/PuppeteerSharp/bin/Release/PuppeteerSharp.Cdp*.nupkg --api-key ${{secrets.NUGET_INT_API_KEY}} --source https://apiint.nugettest.org/v3/index.json
