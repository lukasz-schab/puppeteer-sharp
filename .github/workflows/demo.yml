name: Demo Project

on:
  push:
    branches:
      - master
      - release-*
  pull_request:
    branches: [master]
    paths:
      - "**.cs"
      - "**.csproj"
      - "**/demo.yml"

permissions:
  contents: read

jobs:
  build:

    name: Demo Project
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022, macos-latest]
    env:
      DOTNET_VERSION: '8.0.x' # The .NET SDK version to use

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - uses: actions/setup-dotnet@871f041373faaad213a635d9afb62905ec029bbb # v1.10.1
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: Setup NuGet
      uses: NuGet/setup-nuget@04b0c2b8d1b97922f67eca497d7cf0bf17b8ffe1 # v1.0.5

    - name: Install dependencies
      working-directory: ./demos/PuppeteerSharpPdfDemo
      run: |
        dotnet restore PuppeteerSharpPdfDemo-Local.csproj
    - name: Run Project
      working-directory: ./demos/PuppeteerSharpPdfDemo
      run: |
          dotnet run --project PuppeteerSharpPdfDemo-Local.csproj auto-exit
